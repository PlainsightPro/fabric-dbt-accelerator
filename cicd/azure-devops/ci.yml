# =============================================================================
# ci - PR validation (Azure DevOps mirror of .github/workflows/ci.yml)
#
# Branch strategy:
#   feature/* --PR--> dev --weekly promotion PR--> accept --> prod
#
# Every PR: lint + parse + dbt-bouncer convention checks (dbt-bouncer.yml).
# PRs targeting dev additionally run SLIM CI on the dedicated Fabric CI
# warehouse, using ONE manifest for both roles:
#   dbt-manifest-dev (build-dev pipeline) -> --state:       node SELECTION
#                                         -> --defer-state: ref RESOLUTION
#                                            (defaults to --state)
# That manifest comes from a real `dbt build`, so every relation it names exists
# with the columns it claims. Deferring to a compile-only manifest breaks the
# moment code adds a column the target warehouse has not materialized yet.
# Each PR builds into its own schema pr_<PR id> (see generate_schema_name),
# dropped by the ci-cleanup pipeline. Falls back to a full build (still
# PR-isolated) when the manifest is unavailable.
#
# PREREQUISITE: sources resolve to <LH_source>.<schema>.<table> - cross-database
# queries in Fabric only work between items in the SAME workspace, so the CI
# warehouse must be colocated with the source lakehouse (see
# docs/ci_architecture.md). A smoke test fails fast if it is not.
#
# Concurrency: Azure DevOps has no per-PR cancel-in-progress for PR-triggered
# YAML (batch: applies to CI triggers only). Overlapping runs of the same PR
# are safe regardless: both write only to that PR's pr_<id> schema and the
# last finished run wins.
#
# Setup:
#   - Variable group "dbt-fabric-ci" (Pipelines > Library):
#       DBT_FABRIC_HOST_CI, DBT_FABRIC_DATABASE_CI, DBT_FABRIC_SOURCE_DATABASE,
#       DBT_SP_TENANT_ID, DBT_SP_CLIENT_ID, DBT_SP_CLIENT_SECRET (secret)
#     The connection pair must use the _CI-suffixed names: profiles.yml's ci
#     target reads DBT_FABRIC_HOST_CI/DBT_FABRIC_DATABASE_CI with no unsuffixed
#     fallback (unlike accept/prod). DBT_FABRIC_SOURCE_DATABASE is unsuffixed -
#     that is the name the _sources.yml files read, and it has no default, so
#     parsing fails without it. Azure DevOps exposes non-secret group values to
#     every script step automatically, hence no entry in the env: blocks below.
#   - Set devBuildPipelineId below to the definition ID of the pipeline
#     created from build-dev.yml (visible in its URL).
#   - Azure Repos: add this pipeline as a build-validation branch policy on
#     dev/accept/prod. (The pr: trigger applies to GitHub-hosted repos.)
#
# FORK PRs: Azure DevOps withholds secret variables from builds of forks unless
# "Make secrets available to builds of forks" is enabled on the pipeline - off by
# default, and enabling it hands the service principal to unreviewed code. Both
# jobs need the Fabric CI warehouse, so a guard step fails fast and says so
# rather than letting it surface as an opaque dbt connection error. See
# cicd/README.md, "Contributing from a fork".
# =============================================================================

trigger: none # PR validation only

pr:
  branches:
    include:
      - dev
      - accept
      - prod

pool:
  vmImage: ubuntu-latest

variables:
  - group: dbt-fabric-ci
  # The dbt project lives in dbt/. Azure DevOps has no pipeline-level working
  # directory, so every step invoking dbt, dbt-bouncer or sqlfluff sets
  # workingDirectory: $(dbtDir) explicitly. Steps that belong to the repo root
  # (pip install, the OneLake deploy script) deliberately do not.
  - name: dbtDir
    value: $(Build.SourcesDirectory)/dbt
  - name: DBT_PROFILES_DIR
    value: $(Build.SourcesDirectory)/dbt
  - name: devBuildPipelineId
    value: '' # definition ID of the build-dev pipeline; empty = always full build

jobs:
  - job: parse_and_lint
    displayName: Parse and lint
    steps:
      - checkout: self
      # Runs before the ODBC and pip installs - it needs neither, and a
      # misconfigured run should fail in seconds rather than after a minute of
      # setup. profiles.yml's ci output declares the DBT_SP_* values as bare
      # env_var() with NO default, so empty ones sail past dbt's own check and
      # fail much later: ServicePrincipal auth returns a null connection handle
      # and dbt-fabric dies on "'NoneType' object has no attribute 'cursor'",
      # which sqlfluff reports as a TMP violation blaming an arbitrary model.
      #
      # Two usual causes: the dbt-fabric-ci variable group is not linked to this
      # pipeline, or the PR comes from a FORK - Azure DevOps only passes secret
      # variables to fork builds when "Make secrets available to builds of forks"
      # is enabled on the pipeline (off by default).
      #
      # `bash:` rather than `script:` (used everywhere else in this file) because
      # the ${!name} indirection below is a bashism, and a guard that silently
      # stops guarding under another shell is worse than no guard.
      - bash: |
          missing=""
          for name in DBT_FABRIC_HOST_CI DBT_FABRIC_DATABASE_CI DBT_FABRIC_SOURCE_DATABASE \
                      DBT_SP_TENANT_ID DBT_SP_CLIENT_ID DBT_SP_CLIENT_SECRET; do
            value="${!name}"
            # An UNDEFINED Azure DevOps variable is not substituted at all - the
            # env: mapping below then yields the literal "$(NAME)", not "".
            if [ -z "$value" ] || [ "$value" = "\$($name)" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            if [ "$IS_FORK" = "True" ]; then
              echo "##vso[task.logissue type=error]This PR comes from a fork, and Azure DevOps withholds secret variables from fork builds unless 'Make secrets available to builds of forks' is enabled on this pipeline. Linting and the slim CI build both need the Fabric CI warehouse. See cicd/README.md, 'Contributing from a fork'. Unavailable:$missing"
            else
              echo "##vso[task.logissue type=error]Missing or empty CI configuration:$missing. Check that the 'dbt-fabric-ci' variable group is linked to this pipeline and defines these names - see cicd/README.md."
            fi
            exit 1
          fi
        displayName: Check Fabric CI credentials are available
        env:
          # Secret variables are never auto-exposed to scripts; the non-secret
          # ones are, but map all six so the list reads as one unit.
          DBT_FABRIC_HOST_CI: $(DBT_FABRIC_HOST_CI)
          DBT_FABRIC_DATABASE_CI: $(DBT_FABRIC_DATABASE_CI)
          DBT_FABRIC_SOURCE_DATABASE: $(DBT_FABRIC_SOURCE_DATABASE)
          DBT_SP_TENANT_ID: $(DBT_SP_TENANT_ID)
          DBT_SP_CLIENT_ID: $(DBT_SP_CLIENT_ID)
          DBT_SP_CLIENT_SECRET: $(DBT_SP_CLIENT_SECRET)
          IS_FORK: $(System.PullRequest.IsFork)
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.11'
      # ubuntu-latest ships no ODBC driver. Linting needs one since the dbt
      # templater compiles is_incremental() against the warehouse.
      #
      # A missing driver surfaces as "'NoneType' object has no attribute
      # 'cursor'" - but so does every other reason the connection cannot be
      # opened, so do not read that error as proof this step failed. Credentials
      # are covered by the guard above; the remaining suspect is the service
      # principal's access to the CI workspace, which is easy to lose when the
      # workspace is recreated. Check it with:
      #   az rest --method get --resource https://api.fabric.microsoft.com \
      #     --url https://api.fabric.microsoft.com/v1/workspaces/<id>/roleAssignments
      - script: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
        displayName: Install Microsoft ODBC Driver 18
      - script: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt
        displayName: Install dependencies
      - script: dbt deps
        displayName: Install dbt packages
        workingDirectory: $(dbtDir)
      - script: dbt parse --target ci
        displayName: Parse dbt project
        workingDirectory: $(dbtDir)
        env:
          DBT_FABRIC_HOST_CI: $(DBT_FABRIC_HOST_CI)
          DBT_FABRIC_DATABASE_CI: $(DBT_FABRIC_DATABASE_CI)
          DBT_SP_TENANT_ID: $(DBT_SP_TENANT_ID)
          DBT_SP_CLIENT_ID: $(DBT_SP_CLIENT_ID)
          DBT_SP_CLIENT_SECRET: $(DBT_SP_CLIENT_SECRET)
      - script: dbt-bouncer --config-file dbt-bouncer.yml --only manifest_checks
        displayName: Check dbt conventions (dbt-bouncer)
        workingDirectory: $(dbtDir)
      - script: sqlfluff lint --config .sqlfluff-ci models tests
        displayName: Lint SQL
        workingDirectory: $(dbtDir)
        # The dbt templater compiles through dbt, and the incremental silver
        # models resolve is_incremental() against the warehouse, so linting
        # needs the same ci connection as the parse step above.
        env:
          DBT_FABRIC_HOST_CI: $(DBT_FABRIC_HOST_CI)
          DBT_FABRIC_DATABASE_CI: $(DBT_FABRIC_DATABASE_CI)
          DBT_SP_TENANT_ID: $(DBT_SP_TENANT_ID)
          DBT_SP_CLIENT_ID: $(DBT_SP_CLIENT_ID)
          DBT_SP_CLIENT_SECRET: $(DBT_SP_CLIENT_SECRET)

  - job: slim_ci_build
    displayName: Slim CI build (CI workspace)
    dependsOn: parse_and_lint
    # Only for feature PRs into dev; promotion PRs carry validated commits.
    condition: and(succeeded(), eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/dev'))
    steps:
      - checkout: self
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.11'
      - script: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
        displayName: Install Microsoft ODBC Driver 18
      - script: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt
        displayName: Install dependencies
      - script: dbt deps
        displayName: Install dbt packages
        workingDirectory: $(dbtDir)

      - task: DownloadPipelineArtifact@2
        displayName: Download latest dev manifest (selection + defer state)
        condition: ne(variables['devBuildPipelineId'], '')
        continueOnError: true
        inputs:
          source: specific
          project: $(System.TeamProject)
          pipeline: $(devBuildPipelineId)
          runVersion: latestFromBranch
          runBranch: refs/heads/dev
          artifact: dbt-manifest-dev
          # Inside dbt/ so the steps below find it as ./state_dev.
          path: $(dbtDir)/state_dev

      # Sources compile to <LH_source>.<schema>.<table>. In Fabric that
      # cross-database read only works when the CI warehouse and the source
      # lakehouse live in the SAME workspace - verify before spending build time.
      - script: |
          if [ ! -f state_dev/manifest.json ]; then
            echo "No baseline manifest - skipping (source database name unknown here)."
            exit 0
          fi
          source_db=$(jq -r 'first(.sources[]) | .database' state_dev/manifest.json)
          echo "Probing cross-database read of source lakehouse '$source_db'..."
          dbt run-operation assert_cross_db_access --args "{database: $source_db}" --target ci \
            || { echo "##vso[task.logissue type=error]Cross-database read of source lakehouse '$source_db' failed. Every CI build reads the sources, which requires the CI warehouse to live in the SAME Fabric workspace as the source lakehouse (three-part-name queries are workspace-scoped). See docs/ci_architecture.md."; exit 1; }
        displayName: Smoke test - cross-database access to the source lakehouse
        workingDirectory: $(dbtDir)
        env:
          DBT_FABRIC_HOST_CI: $(DBT_FABRIC_HOST_CI)
          DBT_FABRIC_DATABASE_CI: $(DBT_FABRIC_DATABASE_CI)
          DBT_SP_TENANT_ID: $(DBT_SP_TENANT_ID)
          DBT_SP_CLIENT_ID: $(DBT_SP_CLIENT_ID)
          DBT_SP_CLIENT_SECRET: $(DBT_SP_CLIENT_SECRET)

      # One manifest, both roles:
      #   --state state_dev -> which nodes count as modified (selection)
      #   --defer           -> unmodified refs resolve to the same manifest's
      #                        relations, i.e. the dev baseline that build-dev
      #                        materialized in the CI warehouse's layer schemas.
      # This only holds because build-dev runs a real `dbt build`. If it ever
      # goes back to `dbt compile`, the defer target becomes a promise instead
      # of a fact and column drift resurfaces - see docs/ci_architecture.md.
      #
      # --full-refresh keeps repeated pushes to the same PR deterministic:
      # incremental models in pr_<N> survive between runs, and a merge on top of
      # the previous push's rows would make the result depend on run order.
      - script: |
          if [ -f state_dev/manifest.json ]; then
            echo "Baseline manifest found: building modified+ into pr_${DBT_CI_SCHEMA_SUFFIX}, deferring to the dev baseline."
            dbt build --target ci --selector ci_modified --state state_dev --defer --full-refresh
          else
            echo "Missing manifest: full build into pr_${DBT_CI_SCHEMA_SUFFIX} (no defer)."
            dbt build --target ci --selector full_build --full-refresh
          fi
        displayName: dbt build (slim CI, isolated PR schema)
        workingDirectory: $(dbtDir)
        env:
          DBT_FABRIC_HOST_CI: $(DBT_FABRIC_HOST_CI)
          DBT_FABRIC_DATABASE_CI: $(DBT_FABRIC_DATABASE_CI)
          DBT_SP_TENANT_ID: $(DBT_SP_TENANT_ID)
          DBT_SP_CLIENT_ID: $(DBT_SP_CLIENT_ID)
          DBT_SP_CLIENT_SECRET: $(DBT_SP_CLIENT_SECRET)
          # PR-scoped schema isolation: generate_schema_name routes ALL models of
          # this run into pr_<PR id>. Mandatory - without it a PR build would
          # write into the layer schemas that hold the dev baseline CI defers to.
          DBT_CI_SCHEMA_SUFFIX: $(System.PullRequest.PullRequestId)

      # Catches docs-generation errors (e.g. broken {% docs %} refs) early;
      # needs the objects just built above, so it can't run in parse_and_lint.
      - script: dbt docs generate --target ci
        displayName: Generate dbt docs
        workingDirectory: $(dbtDir)
        env:
          DBT_FABRIC_HOST_CI: $(DBT_FABRIC_HOST_CI)
          DBT_FABRIC_DATABASE_CI: $(DBT_FABRIC_DATABASE_CI)
          DBT_SP_TENANT_ID: $(DBT_SP_TENANT_ID)
          DBT_SP_CLIENT_ID: $(DBT_SP_CLIENT_ID)
          DBT_SP_CLIENT_SECRET: $(DBT_SP_CLIENT_SECRET)
          DBT_CI_SCHEMA_SUFFIX: $(System.PullRequest.PullRequestId)
