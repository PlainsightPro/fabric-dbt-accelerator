# =============================================================================
# build-dev - runs on every merge to dev
# (Azure DevOps mirror of .github/workflows/build-dev.yml)
#
# Full dbt build against the Fabric CI workspace, keeping it in sync with the
# dev branch, and publishes the resulting manifest as the single state artifact
# slim CI uses for BOTH roles (--state for selection, --defer-state for ref
# resolution, which defaults to --state).
#
# The build is what makes the manifest usable as a defer target: it describes
# relations that actually exist, not just code. Do not weaken this to
# `dbt compile` - see docs/ci_architecture.md.
#
# DBT_CI_SCHEMA_SUFFIX is deliberately unset here, so generate_schema_name
# routes models into bronze_sales / silver / gold rather than a pr_<N> schema.
#
# Setup: variable group "dbt-fabric-ci" (same as the ci pipeline), with the
# _CI-suffixed variable names (DBT_FABRIC_HOST_CI/DBT_FABRIC_DATABASE_CI) -
# profiles.yml's ci target has no unsuffixed fallback. After creating this
# pipeline, put its definition ID into devBuildPipelineId in ci.yml so slim
# CI can locate the artifact.
# =============================================================================

trigger:
  branches:
    include:
      - dev

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: dbt-fabric-ci
  # The dbt project lives in dbt/. Azure DevOps has no pipeline-level working
  # directory, so every step invoking dbt sets workingDirectory: $(dbtDir)
  # explicitly; the pip install step belongs to the repo root and does not.
  - name: dbtDir
    value: $(Build.SourcesDirectory)/dbt
  - name: DBT_PROFILES_DIR
    value: $(Build.SourcesDirectory)/dbt

steps:
  - checkout: self

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'

  - script: |
      curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
      curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
      sudo apt-get update
      sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
    displayName: Install Microsoft ODBC Driver 18

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements/requirements.txt
    displayName: Install dependencies

  - script: dbt deps
    displayName: Install dbt packages
    workingDirectory: $(dbtDir)

  # --full-refresh is what keeps the baseline a faithful materialization of the
  # dev branch rather than an accumulation of incremental history. Without it,
  # `on_schema_change` (default: ignore) would silently drop a newly added
  # upstream column from the ads_* tables on merge, and the next PR deferring to
  # them would fail with "Invalid column name" (SQL 42S22).
  - script: dbt build --target ci --selector full_build --full-refresh
    displayName: dbt build (full, CI workspace)
    workingDirectory: $(dbtDir)
    env:
      DBT_FABRIC_HOST_CI: $(DBT_FABRIC_HOST_CI)
      DBT_FABRIC_DATABASE_CI: $(DBT_FABRIC_DATABASE_CI)
      DBT_SP_TENANT_ID: $(DBT_SP_TENANT_ID)
      DBT_SP_CLIENT_ID: $(DBT_SP_CLIENT_ID)
      DBT_SP_CLIENT_SECRET: $(DBT_SP_CLIENT_SECRET)

  - task: PublishPipelineArtifact@1
    displayName: Publish manifest (slim CI state)
    inputs:
      targetPath: $(dbtDir)/target/manifest.json
      artifact: dbt-manifest-dev
