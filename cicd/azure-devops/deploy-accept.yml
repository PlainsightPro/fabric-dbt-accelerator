# =============================================================================
# deploy-accept - deploys the dbt project CODE to the ACCEPT lakehouse
# (Azure DevOps mirror of .github/workflows/deploy-accept.yml)
#
# Triggered when a promotion PR (dev -> accept) is merged. The pipeline does
# NOT run dbt build - it validates the project (dbt compile), uploads the
# project tree to Files/dbt_project in the workspace's lakehouse via
# cicd/scripts/deploy_to_onelake.sh, and writes an _EXTRACTED marker. The
# runtime inside Fabric executes dbt on its own internal schedule.
#
# Setup: variable group "dbt-fabric-accept" (Pipelines > Library):
#   DBT_FABRIC_HOST, DBT_FABRIC_DATABASE          (warehouse, for dbt compile)
#   DBT_FABRIC_WORKSPACE, DBT_FABRIC_DATALAKE_ID  (OneLake target)
#   DBT_SP_TENANT_ID, DBT_SP_CLIENT_ID, DBT_SP_CLIENT_SECRET (secret)
# =============================================================================

trigger:
  branches:
    include:
      - accept

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: dbt-fabric-accept
  - name: DBT_PROFILES_DIR
    value: $(Build.SourcesDirectory)

steps:
  - checkout: self

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'

  - script: |
      curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
      curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
      sudo apt-get update
      sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
    displayName: Install Microsoft ODBC Driver 18

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements/requirements_fabric.txt
    displayName: Install dependencies

  - script: dbt deps
    displayName: Install dbt packages

  # Validation gate BEFORE touching OneLake.
  - script: dbt compile --target accept
    displayName: dbt compile (validation gate)
    env:
      DBT_FABRIC_HOST: $(DBT_FABRIC_HOST)
      DBT_FABRIC_DATABASE: $(DBT_FABRIC_DATABASE)
      DBT_SP_TENANT_ID: $(DBT_SP_TENANT_ID)
      DBT_SP_CLIENT_ID: $(DBT_SP_CLIENT_ID)
      DBT_SP_CLIENT_SECRET: $(DBT_SP_CLIENT_SECRET)

  - script: bash cicd/scripts/deploy_to_onelake.sh
    displayName: Deploy project to OneLake
    env:
      PROJECT_DIR: $(Build.SourcesDirectory)
      DBT_FABRIC_WORKSPACE: $(DBT_FABRIC_WORKSPACE)
      DBT_FABRIC_DATALAKE_ID: $(DBT_FABRIC_DATALAKE_ID)
      DBT_SP_TENANT_ID: $(DBT_SP_TENANT_ID)
      DBT_SP_CLIENT_ID: $(DBT_SP_CLIENT_ID)
      DBT_SP_CLIENT_SECRET: $(DBT_SP_CLIENT_SECRET)
