version: 2

sources:
  - name: sales
    database: LH_source
    description: Demo sales source system loaded from CSV seeds.
    # In dev and ci, seeds land in a target.schema-prefixed schema (see
    # generate_schema_name), so the source must follow. accept/prod read the shared schema.
    schema: raw_sales
    config:
      meta:
        owner: data-platform
        source_system: sales
        medallion: bronze
    tables:
      - name: raw_sales_customers
        description: Raw customer records from the demo sales application.
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
        columns:
          - name: customer_id
            description: Natural customer identifier in the sales source.
            tests: [not_null, unique]
          - name: email
            description: Customer's email address.
            config:
              meta:
                contains_pii: true
          - name: full_name
            description: Customer's full name.
            config:
              meta:
                contains_pii: true
      - name: raw_sales_products
        description: Raw product records from the demo sales application.
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
        columns:
          - name: product_id
            tests: [not_null, unique]
      - name: raw_sales_orders
        description: Raw order headers from the demo sales application.
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
        columns:
          - name: order_id
            tests: [not_null, unique]
      - name: raw_sales_order_lines
        description: Raw order-line transactions from the demo sales application.
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
        columns:
          - name: order_id
            tests: [not_null]
          - name: line_id
            tests: [not_null]