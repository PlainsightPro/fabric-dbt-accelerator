# Drops the PR-scoped CI schema (pr_<PR number>, created by slim CI in ci.yml)
# when a PR into dev is closed - merged or abandoned.
#
# Shares the concurrency group with ci.yml so an in-flight build for the same
# PR is cancelled before the schema is dropped. The drop_pr_schema macro
# no-ops when the schema never existed (e.g. lint-only PRs) and refuses any
# schema name not matching pr_<digits>.
#
# Required repository variables/secrets: same CI-workspace set as ci.yml.

name: ci-cleanup

on:
  pull_request:
    types: [closed]
    branches: [dev]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
  # run-operation parses the whole project first, so the _sources.yml files are
  # rendered even though the macro never reads a source: without this the job
  # dies with "Env var required but not provided". No guard step like ci.yml's -
  # cleanup does not query the sources, so an empty value is harmless here and
  # failing the job would leave the PR schema behind.
  DBT_FABRIC_SOURCE_DATABASE: ${{ vars.DBT_FABRIC_SOURCE_DATABASE_CI }}

# The dbt project lives in dbt/; every run: step below executes there. Steps
# reaching back to the repo root (pip install) spell that out with
# github.workspace, and uses: steps ignore this default entirely.
defaults:
  run:
    working-directory: dbt

jobs:
  drop-pr-schema:
    runs-on: ubuntu-latest
    env:
      DBT_FABRIC_HOST_CI: ${{ vars.DBT_FABRIC_HOST_CI }}
      DBT_FABRIC_DATABASE_CI: ${{ vars.DBT_FABRIC_DATABASE_CI }}
      DBT_SP_TENANT_ID: ${{ secrets.DBT_SP_TENANT_ID }}
      DBT_SP_CLIENT_ID: ${{ secrets.DBT_SP_CLIENT_ID }}
      DBT_SP_CLIENT_SECRET: ${{ secrets.DBT_SP_CLIENT_SECRET }}
    steps:
      # Check out the BASE branch, not the PR merge ref: the macro must exist
      # regardless of what the (possibly abandoned, possibly deleted) PR head
      # contained.
      - name: Check out base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ github.workspace }}/requirements/requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Drop PR schema
        run: >
          dbt run-operation drop_pr_schema
          --args '{schema_name: pr_${{ github.event.pull_request.number }}}'
          --target ci
