# Runs on every merge to dev: compiles the project (no build - nothing is
# materialized here) and publishes the manifest as the SELECTION state that
# PR slim CI (ci.yml) compares against via --state to find modified nodes.
# Ref resolution (--defer-state) uses the accept manifest from deploy-accept.yml
# instead - never this one.

name: build-dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}

jobs:
  build-ci-workspace:
    runs-on: ubuntu-latest
    env:
      DBT_FABRIC_HOST_CI: ${{ vars.DBT_FABRIC_HOST_CI }}
      DBT_FABRIC_DATABASE_CI: ${{ vars.DBT_FABRIC_DATABASE_CI }}
      DBT_SP_TENANT_ID: ${{ secrets.DBT_SP_TENANT_ID }}
      DBT_SP_CLIENT_ID: ${{ secrets.DBT_SP_CLIENT_ID }}
      DBT_SP_CLIENT_SECRET: ${{ secrets.DBT_SP_CLIENT_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Compile dbt project (setup dbt artifacts) - use ci target for authentication reasons
        run: dbt compile --target ci

      - name: Publish manifest (slim CI state)
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest-dev
          path: target/manifest.json
          if-no-files-found: error
