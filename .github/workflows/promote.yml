# Weekly promotion: opens the two promotion PRs of the branch strategy
#
#   dev --PR--> accept --PR--> prod
#
# The PRs are CREATED automatically but MERGED by a human. Merge order matters:
#   1. Merge "accept -> prod" FIRST  (prod receives last week's validated accept state)
#   2. Then merge "dev -> accept"    (accept receives the fresh dev state)
# Merging each PR triggers the corresponding deploy workflow
# (deploy-prod.yml / deploy-accept.yml).
#
# Requirements:
#   - "dev" must be the repository's DEFAULT branch (scheduled workflows only
#     run from the default branch).
#   - Repo Settings > Actions > General: enable
#     "Allow GitHub Actions to create and approve pull requests".

name: Weekly promotion PRs

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC - adjust to your release cadence
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-promotion-prs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository (all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR accept -> prod
        run: |
          if [ "$(git rev-list --count origin/prod..origin/accept)" -gt 0 ]; then
            gh pr create \
              --base prod \
              --head accept \
              --title "Promote accept to prod" \
              --body "Weekly promotion. Merge this PR **before** the dev->accept PR so prod receives the validated accept state." \
              || echo "PR accept->prod already exists, skipping."
          else
            echo "accept and prod are identical - nothing to promote."
          fi

      - name: Create PR dev -> accept
        run: |
          if [ "$(git rev-list --count origin/accept..origin/dev)" -gt 0 ]; then
            gh pr create \
              --base accept \
              --head dev \
              --title "Promote dev to accept" \
              --body "Weekly promotion. Merge this PR **after** the accept->prod PR." \
              || echo "PR dev->accept already exists, skipping."
          else
            echo "dev and accept are identical - nothing to promote."
          fi
