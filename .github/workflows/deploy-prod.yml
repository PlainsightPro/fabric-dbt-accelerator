# Deploys the PROD warehouse from the prod branch.
# Triggered when a promotion PR (accept -> prod) is merged, or manually
# (workflow_dispatch - select the prod branch in the UI for an ad-hoc refresh).
#
# Setup: GitHub Environment "prod" (repo Settings > Environments) holding
# environment-scoped secrets: DBT_FABRIC_HOST, DBT_FABRIC_DATABASE,
# DBT_SP_TENANT_ID, DBT_SP_CLIENT_ID, DBT_SP_CLIENT_SECRET.
# Optionally add required reviewers on the "prod" environment as an extra gate.

name: Deploy prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}

jobs:
  run-prod:
    runs-on: ubuntu-latest
    environment: prod
    env:
      DBT_FABRIC_HOST: ${{ secrets.DBT_FABRIC_HOST }}
      DBT_FABRIC_DATABASE: ${{ secrets.DBT_FABRIC_DATABASE }}
      DBT_SP_TENANT_ID: ${{ secrets.DBT_SP_TENANT_ID }}
      DBT_SP_CLIENT_ID: ${{ secrets.DBT_SP_CLIENT_ID }}
      DBT_SP_CLIENT_SECRET: ${{ secrets.DBT_SP_CLIENT_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements_fabric.txt

      - name: Create profile from template
        run: cp profiles.yml.example profiles.yml

      - name: Install dbt packages
        run: dbt deps

      - name: dbt build (prod)
        run: dbt build --target prod --selector full_build

      - name: Check source freshness
        run: dbt source freshness --target prod
        continue-on-error: true
