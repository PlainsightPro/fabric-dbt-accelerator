# Deploys the dbt project CODE to the PROD workspace's Lakehouse (OneLake).
#
# Triggered when a promotion PR (accept -> prod) is merged. The pipeline does
# NOT run dbt build - it validates the project (dbt compile), uploads the
# project tree to Files/dbt_project in the lakehouse, and writes an _EXTRACTED
# marker. The runtime inside Fabric executes dbt on its own internal schedule.
#
# Setup: GitHub Environment "prod" (repo Settings > Environments) holding
# environment-scoped secrets:
#   DBT_FABRIC_HOST, DBT_FABRIC_DATABASE          (warehouse, for dbt compile)
#   DBT_FABRIC_WORKSPACE, DBT_FABRIC_DATALAKE_ID  (OneLake target)
#   DBT_SP_TENANT_ID, DBT_SP_CLIENT_ID, DBT_SP_CLIENT_SECRET
# Optionally add required reviewers on the "prod" environment - the deployment
# then waits for approval before touching prod.

name: deploy-prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

# The dbt project lives in dbt/; every run: step below executes there. Steps
# reaching back to the repo root (pip install, the deploy script) spell that out
# with github.workspace.
defaults:
  run:
    working-directory: dbt

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    env:
      DBT_FABRIC_HOST: ${{ vars.DBT_FABRIC_HOST }}
      DBT_FABRIC_DATABASE: ${{ vars.DBT_FABRIC_DATABASE }}
      # Source lakehouse for the _sources.yml files; required, no default.
      DBT_FABRIC_SOURCE_DATABASE: ${{ vars.DBT_FABRIC_SOURCE_DATABASE }}
      DBT_FABRIC_WORKSPACE: ${{ vars.DBT_FABRIC_WORKSPACE }}
      DBT_FABRIC_DATALAKE_ID: ${{ vars.DBT_FABRIC_DATALAKE_ID }}
      DBT_SP_TENANT_ID: ${{ secrets.DBT_SP_TENANT_ID }}
      DBT_SP_CLIENT_ID: ${{ secrets.DBT_SP_CLIENT_ID }}
      DBT_SP_CLIENT_SECRET: ${{ secrets.DBT_SP_CLIENT_SECRET }}
    steps:
      - name: Check out prod branch
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ github.workspace }}/requirements/requirements.txt

      - name: Install dbt packages
        run: dbt deps

      # GitHub sets an UNDEFINED environment variable to an empty string rather
      # than leaving it absent, so dbt's own "Env var required but not provided"
      # error never fires - it would render an empty source database instead.
      - name: Check DBT_FABRIC_SOURCE_DATABASE is set
        run: |
          test -n "$DBT_FABRIC_SOURCE_DATABASE" \
            || { echo "::error::Environment variable DBT_FABRIC_SOURCE_DATABASE is unset for this GitHub Environment. It names the Fabric lakehouse holding the raw source tables - see cicd/README.md."; exit 1; }

      # Validation gate BEFORE touching OneLake: a project that does not
      # compile never reaches the lakehouse.
      - name: dbt compile (validation gate)
        run: dbt compile --target prod

      # PROJECT_DIR is the upload root: pointing it at dbt/ keeps the workflows,
      # docs and Claude skills out of Files/dbt_project.
      - name: Deploy project to OneLake
        run: bash ${{ github.workspace }}/cicd/scripts/deploy_to_onelake.sh
        env:
          PROJECT_DIR: ${{ github.workspace }}/dbt
