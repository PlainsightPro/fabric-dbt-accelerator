# Deploys the dbt project CODE to the DEV workspace's Lakehouse (OneLake).
#
# Same contract as deploy-accept / deploy-prod: validate with `dbt compile`,
# upload the project tree to Files/dbt_project, write the _EXTRACTED marker, and
# let the runtime inside Fabric execute dbt on its own schedule. This pipeline
# never builds anything and publishes no state artifact.
#
# WHY dev also gets a deployment: every pipeline target builds with
# --full-refresh (build-dev and slim CI both do, deliberately), so the
# incremental merge path in the silver ads_* models is never exercised anywhere
# in CI. The scheduled dev run is the one place it is - a daily run against
# WH_dev catches an is_incremental() branch that only fails on the second run.
#
# It targets dev_scheduled, NOT dev: the dev target authenticates with the Azure
# CLI and writes personal dev_<username>_* schemas, neither of which works for an
# unattended service-principal run. dev_scheduled writes the canonical layer
# schemas in the same warehouse, so it never collides with a developer's own.
#
# This runs alongside build-dev on the same push. They do not overlap:
# build-dev rebuilds the slim-CI baseline in the CI WORKSPACE, this ships code
# to the DEV workspace.
#
# Setup: GitHub Environment "dev" (repo Settings > Environments) holding the
# environment-scoped variables Terraform prints (`terraform output -raw
# gh_commands`):
#   DBT_FABRIC_HOST, DBT_FABRIC_DATABASE          (WH_dev, for dbt compile)
#   DBT_FABRIC_SOURCE_DATABASE                    (LH_source in the dev workspace)
#   DBT_FABRIC_WORKSPACE, DBT_FABRIC_DATALAKE_ID  (OneLake target)
# plus the DBT_SP_* secrets. The service principal needs Contributor on the dev
# workspace - infra/ grants it when dev has dbt_sp_role set (see variables.tf).

name: deploy-dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

# The dbt project lives in dbt/; every run: step below executes there. Steps
# reaching back to the repo root (pip install, the deploy script) spell that out
# with github.workspace.
defaults:
  run:
    working-directory: dbt

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DBT_FABRIC_HOST: ${{ vars.DBT_FABRIC_HOST }}
      DBT_FABRIC_DATABASE: ${{ vars.DBT_FABRIC_DATABASE }}
      # Source lakehouse for the _sources.yml files; required, no default.
      DBT_FABRIC_SOURCE_DATABASE: ${{ vars.DBT_FABRIC_SOURCE_DATABASE }}
      DBT_FABRIC_WORKSPACE: ${{ vars.DBT_FABRIC_WORKSPACE }}
      DBT_FABRIC_DATALAKE_ID: ${{ vars.DBT_FABRIC_DATALAKE_ID }}
      DBT_SP_TENANT_ID: ${{ secrets.DBT_SP_TENANT_ID }}
      DBT_SP_CLIENT_ID: ${{ secrets.DBT_SP_CLIENT_ID }}
      DBT_SP_CLIENT_SECRET: ${{ secrets.DBT_SP_CLIENT_SECRET }}
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ github.workspace }}/requirements/requirements.txt

      - name: Install dbt packages
        run: dbt deps

      # GitHub sets an UNDEFINED environment variable to an empty string rather
      # than leaving it absent, so dbt's own "Env var required but not provided"
      # error never fires - it would render an empty source database instead.
      - name: Check DBT_FABRIC_SOURCE_DATABASE is set
        run: |
          test -n "$DBT_FABRIC_SOURCE_DATABASE" \
            || { echo "::error::Environment variable DBT_FABRIC_SOURCE_DATABASE is unset for the dev GitHub Environment. It names the Fabric lakehouse holding the raw source tables - see cicd/README.md."; exit 1; }

      # Validation gate BEFORE touching OneLake: a project that does not
      # compile never reaches the lakehouse.
      - name: dbt compile (validation gate)
        run: dbt compile --target dev_scheduled

      # PROJECT_DIR is the upload root: pointing it at dbt/ keeps the workflows,
      # docs and Claude skills out of Files/dbt_project.
      - name: Deploy project to OneLake
        run: bash ${{ github.workspace }}/cicd/scripts/deploy_to_onelake.sh
        env:
          PROJECT_DIR: ${{ github.workspace }}/dbt

      # No manifest is published here, for the same reason as deploy-accept:
      # this pipeline materializes nothing, so a manifest from it would describe
      # code rather than relations. Slim CI defers to the build-dev baseline
      # (see docs/ci_architecture.md).
