# PR validation.
#
# Branch strategy:
#   feature/* --PR--> dev --weekly promotion PR--> accept --weekly promotion PR--> prod
#
# Every PR gets lint + parse + dbt-bouncer convention checks (dbt-bouncer.yml).
# PRs targeting dev additionally run SLIM CI against the dedicated Fabric CI
# warehouse, using ONE manifest for both roles:
#   dbt-manifest-dev (build-dev.yml) -> --state:       node SELECTION
#                                       (what changed vs. the dev branch)
#                                    -> --defer-state: ref RESOLUTION
#                                       (defaults to --state; unmodified refs
#                                        read the dev baseline in the CI warehouse)
# That manifest comes from a real `dbt build`, so every relation it names exists
# with the columns it claims. Deferring to a compile-only manifest breaks the
# moment code adds a column the target warehouse has not materialized yet.
# Each PR builds into its own schema pr_<PR number> (see generate_schema_name),
# dropped again by ci-cleanup.yml when the PR closes. Falls back to a full
# build (still PR-isolated) when the manifest is unavailable.
#
# PREREQUISITE: sources resolve to <LH_source>.<schema>.<table> - cross-database
# queries in Fabric only work between items in the SAME workspace, so the CI
# warehouse must be colocated with the source lakehouse (see
# docs/ci_architecture.md). A smoke test fails fast if it is not.
#
# Required repository variables (CI workspace values):
#   DBT_FABRIC_HOST_CI, DBT_FABRIC_DATABASE_CI
# Required repository secrets:
#   DBT_SP_TENANT_ID, DBT_SP_CLIENT_ID, DBT_SP_CLIENT_SECRET

name: ci

on:
  pull_request:
    branches: [dev, accept, prod]

# One run per PR; a new push cancels the in-flight run. ci-cleanup.yml shares
# this group so a closing PR waits for / cancels its build before dropping the
# pr_<N> schema.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
  # Source lakehouse for the _sources.yml files. Required - they declare it with
  # no default, so it must resolve to a non-empty name (see the guard steps).
  DBT_FABRIC_SOURCE_DATABASE: ${{ vars.DBT_FABRIC_SOURCE_DATABASE_CI }}

# The dbt project lives in dbt/; every run: step below executes there. Steps
# reaching back to the repo root (pip install) spell that out with
# github.workspace, and uses: steps ignore this default entirely.
defaults:
  run:
    working-directory: dbt

jobs:
  parse-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ubuntu-latest ships no ODBC driver. Linting needs one since the dbt
      # templater compiles is_incremental() against the warehouse; without it
      # dbt fails with an opaque "'NoneType' object has no attribute 'cursor'".
      - name: Install Microsoft ODBC Driver 18
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ github.workspace }}/requirements/requirements.txt

      - name: Install dbt packages
        run: dbt deps

      # GitHub sets an UNDEFINED repository variable to an empty string rather
      # than leaving it absent, so dbt's own "Env var required but not provided"
      # error never fires - it would render an empty source database instead.
      - name: Check DBT_FABRIC_SOURCE_DATABASE is set
        run: |
          test -n "$DBT_FABRIC_SOURCE_DATABASE" \
            || { echo "::error::Repository variable DBT_FABRIC_SOURCE_DATABASE_CI is unset. It names the Fabric lakehouse holding the raw source tables - see cicd/README.md."; exit 1; }

      - name: Parse dbt project
        run: dbt parse

      - name: Check dbt conventions (dbt-bouncer)
        run: dbt-bouncer --config-file dbt-bouncer.yml --only manifest_checks

      - name: Lint SQL
        run: sqlfluff lint --config .sqlfluff-ci models tests
        # The dbt templater compiles through dbt, and the incremental silver
        # models resolve is_incremental() against the warehouse, so linting
        # needs a live ci connection.
        env:
          DBT_FABRIC_HOST_CI: ${{ vars.DBT_FABRIC_HOST_CI }}
          DBT_FABRIC_DATABASE_CI: ${{ vars.DBT_FABRIC_DATABASE_CI }}
          DBT_SP_TENANT_ID: ${{ secrets.DBT_SP_TENANT_ID }}
          DBT_SP_CLIENT_ID: ${{ secrets.DBT_SP_CLIENT_ID }}
          DBT_SP_CLIENT_SECRET: ${{ secrets.DBT_SP_CLIENT_SECRET }}

  slim-ci-build:
    # Build on the CI workspace only for feature PRs into dev; promotion PRs
    # (dev->accept, accept->prod) carry already-validated commits.
    if: github.base_ref == 'dev'
    needs: parse-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # needed to download the state artifact from build-dev runs
    env:
      GH_TOKEN: ${{ github.token }}
      DBT_FABRIC_HOST_CI: ${{ vars.DBT_FABRIC_HOST_CI }}
      DBT_FABRIC_DATABASE_CI: ${{ vars.DBT_FABRIC_DATABASE_CI }}
      DBT_SP_TENANT_ID: ${{ secrets.DBT_SP_TENANT_ID }}
      DBT_SP_CLIENT_ID: ${{ secrets.DBT_SP_CLIENT_ID }}
      DBT_SP_CLIENT_SECRET: ${{ secrets.DBT_SP_CLIENT_SECRET }}
      # PR-scoped schema isolation: generate_schema_name routes ALL models of
      # this run into schema pr_<PR number> on the CI warehouse.
      DBT_CI_SCHEMA_SUFFIX: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ github.workspace }}/requirements/requirements.txt

      - name: Install dbt packages
        run: dbt deps

      # See the identical guard in parse-and-lint: an undefined repository
      # variable arrives as an empty string, not as an absent one.
      - name: Check DBT_FABRIC_SOURCE_DATABASE is set
        run: |
          test -n "$DBT_FABRIC_SOURCE_DATABASE" \
            || { echo "::error::Repository variable DBT_FABRIC_SOURCE_DATABASE_CI is unset. It names the Fabric lakehouse holding the raw source tables - see cicd/README.md."; exit 1; }

      - name: Download latest dev manifest (selection + defer state)
        run: |
          run_id=$(gh run list --workflow build-dev.yml --branch dev --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            gh run download "$run_id" --name dbt-manifest-dev --dir state_dev \
              && echo "Downloaded baseline state from build-dev run $run_id" \
              || echo "Artifact download failed - will fall back to full build."
          else
            echo "No successful build-dev run found - will fall back to full build."
          fi

      # Sources compile to <LH_source>.<schema>.<table>. In Fabric that
      # cross-database read only works when the CI warehouse and the source
      # lakehouse live in the SAME workspace - verify before spending build time.
      - name: Smoke test - cross-database access to the source lakehouse
        run: |
          if [ ! -f state_dev/manifest.json ]; then
            echo "No baseline manifest - skipping (source database name unknown here)."
            exit 0
          fi
          source_db=$(jq -r 'first(.sources[]) | .database' state_dev/manifest.json)
          echo "Probing cross-database read of source lakehouse '$source_db'..."
          dbt run-operation assert_cross_db_access --args "{database: $source_db}" --target ci \
            || { echo "::error::Cross-database read of source lakehouse '$source_db' failed. Every CI build reads the sources, which requires the CI warehouse to live in the SAME Fabric workspace as the source lakehouse (three-part-name queries are workspace-scoped). See docs/ci_architecture.md."; exit 1; }

      # One manifest, both roles:
      #   --state state_dev -> which nodes count as modified (selection)
      #   --defer           -> unmodified refs resolve to the same manifest's
      #                        relations, i.e. the dev baseline that build-dev
      #                        materialized in the CI warehouse's layer schemas.
      # This only holds because build-dev runs a real `dbt build`. If it ever
      # goes back to `dbt compile`, the defer target becomes a promise instead
      # of a fact and column drift resurfaces - see docs/ci_architecture.md.
      #
      # --full-refresh keeps repeated pushes to the same PR deterministic:
      # incremental models in pr_<N> survive between runs, and a merge on top of
      # the previous push's rows would make the result depend on run order.
      - name: dbt build (slim CI, isolated PR schema)
        run: |
          if [ -f state_dev/manifest.json ]; then
            echo "Baseline manifest found: building modified+ into pr_${DBT_CI_SCHEMA_SUFFIX}, deferring to the dev baseline."
            dbt build --target ci --selector ci_modified --state state_dev --defer --full-refresh
          else
            echo "Missing manifest: full build into pr_${DBT_CI_SCHEMA_SUFFIX} (no defer)."
            dbt build --target ci --selector full_build --full-refresh
          fi

      # Catches docs-generation errors (e.g. broken {% docs %} refs) early;
      # needs the objects just built above, so it can't run in parse-and-lint.
      - name: Generate dbt docs
        run: dbt docs generate --target ci
