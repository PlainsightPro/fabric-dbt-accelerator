# YAML selectors — reusable, named node selections.
# Usage: dbt build --selector <name>   |   dbt ls --selector <name>
# Docs: https://docs.getdbt.com/reference/node-selection/yaml-selectors

selectors:
  # Defined first: ci_modified and full_build exclude it, and dbt resolves
  # selector references top to bottom.
  - name: project_evaluator
    description: >
      Convention checks: every dbt_project_evaluator model and rule, plus this
      project's exceptions seed (tag project_evaluator). Needs a warehouse
      connection; CI runs it into the PR's pr_<N> schema.
      Example: dbt build --selector project_evaluator --target ci
    definition:
      union:
        - method: package
          value: dbt_project_evaluator
        - method: tag
          value: project_evaluator

  - name: bronze
    description: All bronze staging models.
    definition:
      method: tag
      value: bronze

  - name: silver_and_upstream
    description: Silver ADS models plus everything they depend on.
    definition:
      method: tag
      value: silver
      parents: true

  - name: gold_star_schema
    description: Gold dimensions and facts plus their full upstream lineage.
    definition:
      method: tag
      value: gold
      parents: true

  - name: ci_modified
    description: >
      Slim CI selection - only nodes modified vs. the manifest published by the
      build-dev pipeline, plus their downstream dependents. Requires --state
      pointing at the folder holding that manifest (the CI pipelines pass
      --defer as well, so unmodified upstream refs resolve to the dev baseline
      that build-dev materialized in the CI warehouse's layer schemas).
      Pass --favor-state with it: without that flag dbt prefers a relation of
      the same name left in pr_<N> by an earlier push, which mixes build epochs
      and fails the gold relationships tests. See docs/ci_architecture.md.
      Example: dbt build --selector ci_modified --state ./state --defer --favor-state
    definition:
      union:
        - method: state
          value: modified
          children: true
        # Convention checks run in their own CI step (project_evaluator selector).
        - exclude:
            - method: selector
              value: project_evaluator

  - name: sales_dashboard_refresh
    description: >
      Domain/exposure-driven refresh: everything the sales_performance_semantic_model
      exposure depends on, instead of a full build. Equivalent to the CLI
      shorthand `+exposure:sales_performance_semantic_model`.
    definition:
      method: exposure
      value: sales_performance_semantic_model
      parents: true

  - name: full_build
    description: >
      The whole project - used by build-dev and the accept/prod deployments.
    default: true
    definition:
      union:
        - method: fqn
          value: fabric_dbt_accelerator
        # Convention checks are CI-only; the package is outside this fqn anyway.
        - exclude:
            - method: selector
              value: project_evaluator
