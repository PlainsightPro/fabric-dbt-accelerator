version: 2

sources:
  - name: master_data
    # Lakehouse holding the raw tables. Required - no default, so a missing
    # variable fails at parse time instead of silently pointing somewhere else.
    database: "{{ env_var('DBT_FABRIC_SOURCE_DATABASE') }}"
    description: Business-maintained reference data, intended to be edited through Workbook Connect.
    # Fixed in every target: generate_schema_name prefixes models and seeds, not
    # sources, and infra/scripts/load_sample_data.py writes this exact schema.
    schema: mdm
    config:
      meta:
        owner: business-data-owners
        source_system: workbook_connect
        medallion: bronze
    tables:
      - name: mdm_product_category_mapping
        description: Product category mapping maintained by business owners using Workbook Connect.
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 30, period: day}
          error_after: {count: 90, period: day}
        columns:
          - name: category_code
            tests: [not_null, unique]
