name: fabric_dbt_accelerator
version: '1.0.0'
config-version: 2

flags:
  partial_parse: true
  state_modified_compare_more_unrendered_values: true

profile: fabric_dbt_accelerator

model-paths: ['models']
analysis-paths: ['analysis']
test-paths: ['tests']
seed-paths: ['seeds']
macro-paths: ['macros']
snapshot-paths: ['snapshots']

target-path: 'target'
clean-targets:
  - 'target'
  - 'dbt_packages'

require-dbt-version: ['>=1.9.0', '<2.0.0']

# Writes one row per executed node per invocation to <dbt_run_log_schema>.fct_dbt_runs
# / dim_dbt_nodes, so scheduled Fabric runs leave an auditable trail in the
# warehouse. No-ops on every target outside dbt_run_log_targets, and never fires
# on `dbt compile` - see macros/log_run_results.sql.
on-run-end:
  - "{{ log_run_results(results) }}"

vars:
  dbt_run_log_schema: meta
  dbt_run_log_targets: ['accept', 'prod']

models:
  fabric_dbt_accelerator:
    bronze:
      +materialized: view
      +tags: ['bronze']
      staging:
        sales:
          +schema: bronze_sales
          +tags: ['sales'] # domain tag, additive with +tags: ['bronze'] above
        hr:
          +schema: bronze_hr
          +tags: ['hr'] # domain tag, additive with +tags: ['bronze'] above
        master_data:
          +schema: bronze_masterdata
          +tags: ['masterdata'] # domain tag, additive with +tags: ['bronze'] above
    silver:
      +schema: silver
      +materialized: view
      +tags: ['silver']
      ads:
        +materialized: incremental
        +incremental_strategy: merge
        +tags: ['ads']
      intermediate:
        +materialized: view
        +tags: ['intermediate']
    gold:
      +schema: gold
      +materialized: table
      +tags: ['gold']

