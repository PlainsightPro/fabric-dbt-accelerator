name: fabric_dbt_accelerator
version: '1.0.0'
config-version: 2

flags:
  partial_parse: true
  state_modified_compare_more_unrendered_values: true

profile: fabric_dbt_accelerator

model-paths: ['models']
analysis-paths: ['analysis']
test-paths: ['tests']
seed-paths: ['seeds']
macro-paths: ['macros']
snapshot-paths: ['snapshots']

target-path: 'target'
clean-targets:
  - 'target'
  - 'dbt_packages'

require-dbt-version: ['>=1.9.0', '<2.0.0']

models:
  fabric_dbt_accelerator:
    bronze:
      +materialized: view
      +tags: ['bronze']
      staging:
        sales:
          +schema: bronze_sales
          +tags: ['sales'] # domain tag, additive with +tags: ['bronze'] above
        hr:
          +schema: bronze_hr
        master_data:
          +schema: bronze_masterdata
    silver:
      +schema: ads
      +materialized: view
      +tags: ['silver', 'ads']
      ads:
        +materialized: incremental
        +incremental_strategy: merge
    gold:
      +schema: gold
      +materialized: table
      +tags: ['gold']

